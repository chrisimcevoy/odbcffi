networks:
  default:
    name: odbcffi

x-common-setup: &common-setup
  depends_on:
    mysql:
      condition: service_healthy
    postgresql:
      condition: service_healthy
    sqlserver:
      condition: service_healthy
  volumes:
    - .:/usr/src/app
  environment:
    UV_PROJECT_ENVIRONMENT: /opt/odbcffi/.venv
    # These are used in conftest.py so that tests target the
    # db services defined in this file.
    MYSQL_HOST: mysql
    POSTGRESQL_HOST: postgresql
    SQL_SERVER_HOST: sqlserver

services:
  pypy:
    build:
      context: .
      args:
        UV_PYTHON: pypy3.10
    <<: *common-setup

  pypy-latest:
    build:
      context: .
      args:
        UV_PYTHON: pypy3.11
    <<: *common-setup

  cpython:
    build:
      context: .
      args:
        UV_PYTHON: python3.10
    <<: *common-setup

  cpython-latest:
    build:
      context: .
      args:
        UV_PYTHON: python3.14
    <<: *common-setup

  mysql:
    image: mysql:latest@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: super-secret-password
      MYSQL_USER: sa
      MYSQL_PASSWORD: Password123
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-psuper-secret-password", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgresql:
    image: postgres:latest@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Password123
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sa"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
